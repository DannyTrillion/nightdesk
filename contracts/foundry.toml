[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false

# Robinhood Chain raises the contract size limit to 96KB (vs 24KB on L1),
# so we are not bytecode-constrained the way an L1 build would be.
[rpc_endpoints]
rh_testnet = "https://rpc.testnet.chain.robinhood.com"
rh_mainnet = "https://rpc.mainnet.chain.robinhood.com"

[etherscan]
rh_testnet = { key = "unused", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }
rh_mainnet = { key = "unused", chain = 4663, url = "https://robinhoodchain.blockscout.com/api/" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
